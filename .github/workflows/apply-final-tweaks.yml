name: Apply final supervisor wording fixes

on:
  push:
    branches: [ main ]

jobs:
  revise:
    if: github.event.head_commit.message != 'Apply final supervisor wording fixes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final wording tweaks
        run: python .github/final_tweaks.py
      - name: Commit revised thesis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reserse.tex
          if git diff --cached --quiet; then
            echo "No thesis changes to commit"
          else
            git commit -m "Apply final supervisor wording fixes"
            git push
          fi
