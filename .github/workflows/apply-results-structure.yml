name: Apply results/objectives restructuring

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/restructure_results_objectives.py'
      - '.github/workflows/apply-results-structure.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply restructuring
        run: python .github/scripts/restructure_results_objectives.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reserse.tex
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restructure results and dissertation conclusions"
            git push
          fi
