name: Build thesis PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean LaTeX source
        run: python3 .github/scripts/cleanup_tex.py

      - name: Commit cleaned source if changed
        run: |
          if git diff --quiet -- reserse.tex; then
            echo "No source changes required."
          else
            git config user.name "ChatGPT via GitHub Actions"
            git config user.email "actions@users.noreply.github.com"
            git add reserse.tex
            git commit -m "Clean LaTeX preamble without changing content"
            git push
          fi

      - name: Compile dissertation
        uses: xu-cheng/latex-action@v3
        with:
          root_file: reserse.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dissertation-pdf
          path: reserse.pdf
          if-no-files-found: warn
