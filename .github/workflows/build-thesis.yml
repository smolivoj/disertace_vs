name: Build thesis PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean LaTeX source without changing document content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('reserse.tex')
          text = path.read_text(encoding='utf-8')

          start_marker = r'\usepackage[utf8]{inputenc}'
          end_marker = r'\begin{document}'
          start = text.index(start_marker)
          end = text.index(end_marker)

          clean_preamble = r'''\usepackage[utf8]{inputenc}
\usepackage{pgfplots}
\pgfsetplotmarksize{0pt}
\usepackage{filecontents}
\usepackage{caption}
\usepackage[czech, english]{babel}
\selectlanguage{czech}
\usepackage{color}
\usepackage{multicol}
\setlength{\columnsep}{1cm}
\usepackage{url}
\inputencoding{utf8}
\usepackage{hyperref}
\usepackage[all]{hypcap}
\hypersetup{colorlinks=false, linkbordercolor=1 1 1, citebordercolor=1 1 1}
\usepackage[right]{lineno}
\usepackage{a4wide}
\usepackage{nccmath}
\usepackage{csvsimple}
\usepackage{pdflscape}
\usepackage{xcolor}
\usepackage{lmodern}
\usepackage{diagbox}
\usepackage{tikz,colortbl,amsmath}
\usetikzlibrary{calc}
\usepackage{zref-savepos}
\usepackage{adjustbox}
\usepackage{etoolbox}
\usepackage{bookmark}
\usepackage{booktabs}
\usepackage{siunitx}
\usepackage{graphicx}
\usepackage{subcaption}
\usepackage{float}
\usetikzlibrary{arrows.meta, positioning}
\usepackage{pgfplotstable}
\pgfplotsset{compat=1.18}
\usepgfplotslibrary{fillbetween}

\sisetup{
  per-mode=symbol,
  detect-all,
  range-phrase=--,
}

\usepackage[backend=biber,style=numeric,defernumbers=true,sorting=none]{biblatex}
\addbibresource{ref.bib}

% Bibliography filters
\defbibfilter{mypubs}{
  keyword={mypub}
}

\defbibfilter{otherrefs}{
  not keyword={mypub}
}

% Prefix the author's publications with "A" in the bibliography.
\DeclareFieldFormat{labelnumber}{\ifkeyword{mypub}{A#1}{#1}}

% Citation command used for the author's publications.
\DeclareCiteCommand{\mycite}[\mkbibbrackets]
  {\usebibmacro{prenote}}
  {\usebibmacro{citeindex}%
   \printtext[bibhyperref]{%
     \printfield{labelnumber}}}
  {\multicitedelim}
  {\usebibmacro{postnote}}

'''

          new_text = text[:start] + clean_preamble + text[end:]

          if new_text != text:
              path.write_text(new_text, encoding='utf-8')
          PY

          if git diff --quiet -- reserse.tex; then
            echo "LaTeX source already clean."
          else
            git config user.name "ChatGPT via GitHub Actions"
            git config user.email "actions@users.noreply.github.com"
            git add reserse.tex
            git commit -m "Clean LaTeX preamble without changing content"
            git push
          fi

      - name: Compile dissertation
        uses: xu-cheng/latex-action@v3
        with:
          root_file: reserse.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dissertation-pdf
          path: reserse.pdf
          if-no-files-found: warn
