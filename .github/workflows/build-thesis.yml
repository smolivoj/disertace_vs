name: Build thesis PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply supervisor revision
        run: |
          cat .github/patch_parts/part0.txt .github/patch_parts/part1.txt .github/patch_parts/part23.txt .github/patch_parts/part45.txt > /tmp/revision.b64
          base64 -d /tmp/revision.b64 > /tmp/revision.xz
          xz -d /tmp/revision.xz
          git apply --check /tmp/revision
          git apply /tmp/revision

      - name: Commit revised thesis
        run: |
          git config user.name "ChatGPT via GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add reserse.tex ref.bib
          git commit -m "Incorporate supervisor revisions"
          git push

      - name: Compile dissertation
        uses: xu-cheng/latex-action@v3
        with:
          root_file: reserse.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dissertation-pdf
          path: reserse.pdf
          if-no-files-found: warn
