name: Build thesis PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply supervisor revision
        run: |
          cat .github/patch2/part0.txt .github/patch2/part1.txt .github/patch2/part2.txt .github/patch2/part3.txt > /tmp/revision.b64
          base64 -d /tmp/revision.b64 > /tmp/revision.xz
          xz -d /tmp/revision.xz
          if git apply --check /tmp/revision; then
            git apply /tmp/revision
          elif grep -q "Supervisor-consultant" reserse.tex && grep -q "EUROfusionDTE3" ref.bib; then
            echo "Supervisor revision already applied."
          else
            echo "Supervisor revision patch is incompatible with current sources."
            exit 1
          fi

      - name: Commit revised thesis if changed
        run: |
          if git diff --quiet -- reserse.tex ref.bib; then
            echo "No thesis changes to commit."
          else
            git config user.name "ChatGPT via GitHub Actions"
            git config user.email "actions@users.noreply.github.com"
            git add reserse.tex ref.bib
            git commit -m "Incorporate supervisor revisions"
            git push
          fi

      - name: Compile dissertation
        uses: xu-cheng/latex-action@v3
        with:
          root_file: reserse.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dissertation-pdf
          path: reserse.pdf
          if-no-files-found: warn
