name: Insert HEFEL diagram into dissertation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/insert-hefel.yml'
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet PyMuPDF
      - run: python .github/scripts/insert_hefel.py
      - name: Commit the schematic and TeX update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reserse.tex hefel_schematic.png
          git commit -m "Insert published HEFEL schematic and citation"
          git push
