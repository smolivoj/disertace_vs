name: Refine thesis results synthesis

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/refine_results_synthesis.py'
      - '.github/workflows/refine-results-synthesis.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply results synthesis refinement
        run: python .github/scripts/refine_results_synthesis.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reserse.tex
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine results interpretation and dissertation conclusion"
            git push
          fi
